profile:
  name: "Jiacheng/Gavin Zhong"
  photo: "images/photo.png"
  bio:
    - "I am a recent Master's graduate in Security Informatics from <a href='https://www.jhu.edu/'>Johns Hopkins University</a>, where I was advised by <a href='https://yinzhicao.org'>Prof. Yinzhi Cao</a>."
    - "My research focuses on AI System Security, Program Analysis and Identity Security, particularly building agentic system to detect and exploit vulnerabilities in large-scale applications, acknowledged by Microsoft, Google, Meta, Alibaba and HuggingFace."
    - "Besides, I play CTFs! I'm a team lead of JHU's inaugural eCTF team to design secure systems while exploiting cryptographic flaws, earning top placements in Raymond James CTF and Mountain West Cyber Challenge, and a member of CTF team r3kapig (international team, Top 3 on <a href='https://ctftime.org/'>CTFTime.org</a>)"
  links:
    - label: "Email"
      url: "https://mailhide.io/e/2XaRtyGh"
      onclick: "popup=window.open('https://mailhide.io/e/2XaRtyGh','mailhidepopup','width=580,height=635'); return false;"
    - label: "GitHub"
      url: "https://github.com/superboy-zjc"
    - label: "Blog"
      url: "https://blog.2h0ng.wiki/"
