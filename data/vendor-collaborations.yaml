          Found with JAW (Comment and Control paper). The issue-labeled workflow in
          streamlit/streamlit runs Cursor CLI on attacker-controlled issue data; a crafted
          payload makes the agent dump the process environment (ps auxeww) into a public
          workflow artifact, exposing CURSOR_API_KEY. The paper lists the status as Bounty and
          names Snowflake among the vendors that paid bounties; amount not recorded. Year
          inferred from the paper's March 2026 dataset snapshot.

