# =============================================================================
# Vendor Collaboration Records — Source of Truth
# Maintained by Jiacheng (Gavin) Zhong
#
# Real-world vulnerabilities responsibly disclosed to and remediated by vendors.
# Add new records over time; this file is the authoritative career record.
#
# Structure: grouped by vendor. Each vendor has one or more `findings`.
#
# Vendor fields:
#   - name        : company name
#   - rank        : display order by prominence (1 = shown first); lower = earlier
#   - domain      : primary web domain, used to fetch the company favicon/logo ("" = none)
#   - findings    : list of findings (fields below)
#
# Finding fields:
#   - title       : report / advisory title
#   - vuln_class  : short vulnerability category
#   - date        : ISO 8601 (YYYY-MM-DD) disclosure / report date, or null
#   - bounty_usd  : numeric reward in USD, or null if none / undisclosed
#   - bounty_rmb  : numeric reward in RMB (optional; used when paid in RMB)
#   - recognition : Hall of Fame, leaderboard, or other acknowledgement, or null
#   - cve         : associated CVE id, or null
#   - references  : list of {label, url}
#   - notes       : free-form notes
# =============================================================================

