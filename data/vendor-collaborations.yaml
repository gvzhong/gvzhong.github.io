        notes: >-
          Agentic workflow hijacking ("Comment and Control") with Aonan Guan and Zhengyu Liu.
          A payload hidden in an HTML comment of a GitHub issue hijacks Copilot Agent once the
          issue is assigned to it, bypassing GitHub's environment filtering, secret scanning,
          and network firewall to exfiltrate secrets. GitHub first called it a known issue,
          then paid a $500 bounty in March 2026 (The Register). Year is the public disclosure
          year (April 2026); the report date is not recorded.

