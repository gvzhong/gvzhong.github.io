  # ── WordPress ───────────────────────────────────────────────────────────
  - name: "WordPress"
    rank: 7
    domain: "wordpress.org"
    findings:
      - title: "Cross-site scripting via a trusted oEmbed provider (Imgur embeds)"
        vuln_class: "XSS → RCE (trusted oEmbed provider)"
        impact: "Core XSS-to-RCE via trusted oEmbed, on the CMS behind 40%+ of the web."
        date: "2026-10-06"
        bounty_usd: null
        recognition: "Credited in the WordPress 7.1.3 security release notes"
        cve: null
        references:
          - label: "WordPress 7.1.3 Maintenance and Security Release"
            url: "https://wordpress.org/news/2026/10/wordpress-7-1-3-maintenance-and-security-release/"
        notes: >-
          Reported jointly with Zhengyu Liu and Jingcheng Yang. Imgur was on WordPress's trusted
          oEmbed allowlist, which bypasses the sandboxing filter, so uploader-controlled response
          text rendered unfiltered; the fix removes Imgur as a trusted provider. The XSS
          escalates to RCE (per Jiacheng, 2026-11-20). No CVE identifier had been published for
          this item as of 2026-10-26.

